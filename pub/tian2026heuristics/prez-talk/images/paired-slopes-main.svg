<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 134" width="400" height="134" role="img" aria-label="One paired cell per model of the level0:level1 contrast, its repeat-1 pair, one small panel per environment. Within a panel each grey line joins that model's unshielded (open-arm) score on the left to its shielded-arm score on the right, on that environment's own scale; a line falling to the right is a gap in the registered direction. The mean of the drawn pairs is drawn over them dark and full opacity. Per panel: Connect Four (Adapted), 13 repeat-1 pairs drawn (one per model), open mean +0.820, shielded mean +0.691; the pack's gap over every repeat (13 models) is +0.041 [−0.157 .. +0.219]; Hopper (MuJoCo), 13 repeat-1 pairs drawn (one per model), open mean +2053, shielded mean +669; the pack's gap over every repeat (13 models) is +1216 [+630 .. +1831]; Slime Volleyball (Adapted), 13 repeat-1 pairs drawn (one per model), open mean +1.421, shielded mean −1.719; the pack's gap over every repeat (13 models) is +2.931 [+1.687 .. +4.287]. Panels omitted from this drawing: Breakout (Atari ALE with ARI) (drawn in the full figure).">
