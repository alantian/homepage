<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 210" width="960" height="210" role="img" aria-label="Scatter of 47 ranked models' posterior z against mean cost per priced run (billed plus notional USD, list price, divided by priced runs, log-scaled horizontal axis). The 19 models that are near the Pareto frontier, meaning at most 2 other models are both cheaper per run and higher-scoring, or among the top 5 by posterior z (GPT-6 Astra, Claude Fable 5.1, GPT-5.6 Sol, Claude Fable 5, DeepSeek V4.1 Flash, Claude Opus 5, Muse Spark 1.2, GPT-5.6 Luna, Gemini 3.5 Flash-Lite, Seed 2.1 Turbo, GLM-5.3 Flash, DeepSeek V4 Flash (0731), Muse Glimmer 30B, Ling 3.0 Flash, Mercury 2, Qwen3.8-Flash-Next, Llama 3.1 8B, Llama 4 Maverick, Nemotron 3 Super), are labelled on the plot itself, each name written beside its dot, above and to its left wherever the axis leaves room; the remaining 28 are drawn as unnamed dots in their registry colours, with no legend (Grok 4.6, Claude Opus 4.8, GLM-5.2, Claude Sonnet 5, Gemini 3.6 Flash, GPT-5.6 Terra, MiniMax M3, Qwen3-Max, Gemini 3.5 Flash, Grok 4.20, GLM-5.3, Gemini 3.1 Pro, Kimi K3, Qwen3.8-2.4T-A95B, DeepSeek V4 Pro (0813), Hunyuan 3, Qwen3.7-Max, Kimi K2, Step 3.7, DeepSeek V4 Pro, Qwen3.8-Max, Seed 2.0 Code, MiMo V2.5, Kimi K2.6, Gemini 3.7 Flash, Hunyuan 4 Preview, Mistral Large 3, Nova Premier). A step line traces the frontier, the 8 models no cheaper-per-run model out-scores (Llama 3.1 8B, Qwen3.8-Flash-Next, Ling 3.0 Flash, DeepSeek V4 Flash (0731), GPT-5.6 Luna, DeepSeek V4.1 Flash, Claude Fable 5.1, GPT-6 Astra), each ringed on the plot. 1 model rounded to $0.00 mean cost per run and are shown at the axis floor.">
